name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  plugin:
    name: calls plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: grep -E '^[A-Z_]+=' upstream.env >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: ./scripts/build-calls.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: calls-plugin
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Built from upstream calls `${{ steps.pin.outputs.CALLS_TAG }}`.

            Set `MM_CALLS_GROUP_CALLS_ALLOWED=true` on the server, then upload the
            bundle in System Console > Plugins > Plugin Management.
            Full instructions: https://mattermore.dev/install

            Verify the download:

            ```
            sha256sum -c mattermore-calls-${{ steps.pin.outputs.CALLS_VERSION }}.tar.gz.sha256
            ```

  image:
    name: server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.11.1' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          CONTAINER_ENGINE: docker
        run: ./scripts/build-image.sh ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
                     ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:latest

  notify:
    name: notify Mattermost
    needs: [plugin, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test notifier
        run: python3 -m unittest discover -s scripts -p test_notify_release.py
      - name: Verify published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq 'select(.isDraft == false) | .url')
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Notify channel
        env:
          MATTERMOST_RELEASE_WEBHOOK: ${{ secrets.MATTERMOST_RELEASE_WEBHOOK }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: python3 scripts/notify-release.py
