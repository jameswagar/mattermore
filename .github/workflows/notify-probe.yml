name: release-notifier-probe
on:
  push:
    branches: [ci/mattermore-release-notifications]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p test_notify_release.py
      - name: Test webhook delivery
        env:
          MATTERMOST_RELEASE_WEBHOOK: ${{ secrets.MATTERMOST_RELEASE_WEBHOOK }}
          RELEASE_URL: https://github.com/jameswagar/mattermore/releases/tag/v1.6.4
          NOTIFY_TEST: '1'
        run: env GITHUB_REF_NAME=v1.6.4 python3 scripts/notify-release.py
